<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Helado de 3 bolas</title>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
</head>

<body>



  <a-scene>


      <a-sky src="img/imagen.jpg" rotation="0 -130 0"></a-sky>

      <a-text font="kelsonsans" value="Puy de Sancy, France" width="6" position="-2.5 0.25 -1.5"
              rotation="0 15 0"></a-text>

    
    <!-- Piso -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 3"
      width="20"
      height="20"
      color="#90EE90">
    </a-plane>


    <!-- HELADO -->
    <a-entity position="0 0 -4">

      <!-- CONO: punta hacia abajo -->
     <a-cone
  position="0 1 0"
  radius-bottom="0.55"
  radius-top="0.05"
  height="1.8"
  color="#D2691E"
  segments-radial="32"
  rotation="180 0 0">
</a-cone>

      <!-- BOLA 1: FRESA -->
      <a-sphere>
        position="0 2.05 0"
        radius="0.55"
        color="#FF4F81"

      </a-sphere>


      <!-- BOLA 2: VAINILLA -->
      <a-sphere>
        position="0 2.95 0"
        radius="0.55"
        color="#FFF2A6"
        
      </a-sphere>


      <!-- BOLA 3: CHOCOLATE -->
      <a-sphere>
        position="0 3.85 0"
        radius="0.55"
        color="#8B4513"
        </a-sphere>
         



    <!-- Luces -->
    <a-light
      type="ambient"
      color="#FFFFFF"
      intensity="1.5">
    </a-light>

    <a-light
      type="directional"
      position="-3 5 4"
      intensity="2">
    </a-light>

  </a-scene>





</body>
</html>
